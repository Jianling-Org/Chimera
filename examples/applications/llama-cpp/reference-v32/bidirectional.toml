# Reference conditional scope; replace all /absolute/path entries and CHIMERA_MAP_PIN.
[config]
data_root = "/absolute/path/to/reference-run/data"
workspace_root = "/absolute/path/to/reference-run/workspaces"
scalar_root = "/absolute/path/to/scalar"
workspace_name = "auto"

[[config.translators]]
source = "riscv64;rvv;vlen=1024"
target = "riscv64;rvv;vlen=256"
translator_path = "/absolute/path/to/Chimera/preprocessing/translator/rvv_sbt_tool/rvv_sbt_rvv.py"
[[config.translators]]
source = "riscv64;rvv;vlen=256"
target = "riscv64;rvv;vlen=1024"
translator_path = "/absolute/path/to/Chimera/preprocessing/translator/rvv_sbt_tool/rvv_sbt_rvv1024.py"

[config.tools]
python = "/usr/bin/python3"
cc = "gcc"
objdump = "objdump"
nm = "nm"
cmake = "/absolute/path/to/Chimera/examples/applications/llama-cpp/reference-v32/cmake-runtime-debug"
cc_flags = ["-march=rv64imafdc_zba_zbb_zbc_zbs_zfa_zfh_zicond_zicsr_zifencei_zihintpause_zihpm_zkt_zvbb_zvbc_zve32f_zve32x_zve64d_zve64f_zve64x_zvfh_zvfhmin_zvkb_zvkg_zvkned_zvknha_zvknhb_zvksed_zvksh_zvkt_zicbop_zihintntl", "-mabi=lp64d"]

[config.target_files]
sysroot = "/"
library_roots = ["/absolute/path/to/reference-target-libs", "/usr/lib/riscv64-linux-gnu", "/usr/lib"]

[config.runtime]
bpf_map = "/sys/fs/bpf/CHIMERA_MAP_PIN"
ai_thread_control = "/proc/set_ai_thread"

[profile]
name = "linux-riscv64-rvv-1024-to-256"
target_os = "linux"
target_arch = "riscv64"
target_arch_extension = "rvv"
runtime_scene = "linux_riscv64_rvv_v1"
runtime_abi = 1


[[profile.workflow.steps]]
step = "prepare-workspace"

[[profile.workflow.steps]]
step = "build-runtime"

[[profile.workflow.steps]]
step = "disassemble"

[[profile.workflow.steps]]
step = "build-program-model"

[[profile.workflow.steps]]
step = "safety"
parameters = { min_vlen_bits = 256, compiler_metadata = [], unknown_stack_size_policy = "assume-scalar-independent" , external_scalar_leaf_contracts = [{ symbol = "memset", library = "libc.so.6", sha256 = "9e176e749295e63146af11a20ccef2f2c1273692ce899b3437257145ae9d62ff" }] }

[[profile.workflow.steps]]
step = "translate"
parameters = { source = "riscv64;rvv;vlen=1024", target = "riscv64;rvv;vlen=256" }

[[profile.workflow.steps]]
step = "translate"
parameters = { source = "riscv64;rvv;vlen=256", target = "riscv64;rvv;vlen=1024" }

[[profile.workflow.steps]]
step = "offset-map"

[[profile.workflow.steps]]
step = "patch-safepoints"

[[profile.workflow.steps]]
step = "finalize-workspace"
